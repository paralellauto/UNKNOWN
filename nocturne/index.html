<html lang="en" data-base="../">
<head>

<title>MAROATA · Nocturne</title>

<style>
/* NOCTURNE — inside Juliet's lenses. Night sky, champagne gold and lens violet; a Didone masthead
   over a locket portrait, glass cards drifting on constellation lines. Desktop board 1280×800. */
:root {
  --night: #08070d;
  --glass: rgba(20, 16, 34, .5);
  --lens: #8b6fd1;
  --gold: #d4b07a;
  --rose: #e9a3b8;
  --star: #f2eef8;
  --mist: rgba(242, 238, 248, .6);
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", "Bodoni MT", Georgia, serif;
  --f-wide: "Syncopate", "Arial Black", "Helvetica Neue", sans-serif;
  --f-body: "Jost", "Futura", "Century Gothic", "Avenir Next", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--star); }
body { font: 400 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
img { display: block; max-width: 100%; }
.label { font: 400 9.5px/1.2 var(--f-wide); letter-spacing: .27em; text-transform: uppercase; color: var(--gold); }

/* ---------- sky ---------- */
.sky { position: fixed; inset: 0; background:
  radial-gradient(60% 50% at 80% 12%, rgba(139,111,209,.2), transparent 70%),
  radial-gradient(50% 45% at 12% 92%, rgba(233,163,184,.09), transparent 70%),
  radial-gradient(70% 60% at 50% 45%, #120e22 0%, var(--night) 70%); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; }

/* ---------- board ---------- */
.board { position: fixed; inset: 0; z-index: 2; }
#lines { display: none; }

.kicker { position: absolute; z-index: 4; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 18px); text-align: center; }
.mast { position: absolute; z-index: 3; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 34px); margin: 0; text-align: center;
  font: italic 400 21vw/1 var(--f-display); font-variation-settings: "opsz" 96; letter-spacing: -.01em;
  background: linear-gradient(100deg, #b99a6a 0%, #f6ecd9 30%, #d4b07a 52%, #fff7ea 70%, #b99a6a 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sheen 12s ease-in-out infinite alternate;
}
@keyframes sheen { from { background-position: 0% 0; } to { background-position: 100% 0; } }

/* locket portrait + rings */
.locket { position: absolute; z-index: 4; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 27vw + 48px); height: calc(100% - 27vw - 400px - var(--deck, 0px)); min-height: calc(170px - var(--deck, 0px) / 2); transition: height .5s var(--ease), min-height .5s var(--ease); max-height: 100vw; aspect-ratio: 4 / 5; transform: translateX(-50%); }
.locket__frame { position: absolute; inset: 0; border-radius: 50%; padding: 7px; border: 1px solid rgba(212,176,122,.55); box-shadow: 0 0 90px 10px rgba(139,111,209,.28), inset 0 0 0 1px rgba(212,176,122,.12); }
.locket__img { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 1px solid rgba(212,176,122,.8); }
.locket__img img { width: 100%; height: 100%; object-fit: cover; object-position: 46% 40%; transform: scale(1.06); }
.locket__open { position: absolute; inset: 0; border-radius: 50%; }
.locket__tag { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); padding: 5px 12px 4px; border-radius: 99px; background: var(--night); border: 1px solid rgba(212,176,122,.45); white-space: nowrap; }
.rings { position: absolute; left: 50%; top: 50%; width: 190%; height: 70%; transform: translate(-50%, -50%) rotate(-14deg); overflow: visible; pointer-events: none; }
.rings.back { z-index: -1; }
.rings ellipse { fill: none; }
.rings .r1 { stroke: rgba(212,176,122,.42); stroke-width: 1; }
.rings .r2 { stroke: rgba(139,111,209,.35); stroke-width: 1; stroke-dasharray: 2 6; }
.rings.front { clip-path: inset(50% 0 0 0); z-index: 2; }

/* quote */
.quote { position: absolute; z-index: 4; left: 24px; right: 24px; bottom: calc(190px + var(--deck, 0px) + env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center; transition: opacity .7s var(--ease), transform .7s var(--ease), bottom .5s var(--ease); }
.quote.is-out { opacity: 0; transform: translateY(6px); }
.m-quote__text { margin: 0 auto; max-width: 26ch; font: italic 400 21px/1.3 var(--f-display); font-variation-settings: "opsz" 28; color: var(--star); text-wrap: balance; }
.m-quote__text::before { content: "“"; } .m-quote__text::after { content: "”"; }
.m-quote__by { margin: 12px 0 0; font: 400 9.5px/1 var(--f-wide); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }

/* next date */
.next { position: absolute; z-index: 4; left: 16px; right: 16px; bottom: calc(96px + var(--deck, 0px) + env(safe-area-inset-bottom, 0px)); transition: bottom .5s var(--ease); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.next [data-m="next-gig"] { display: flex; align-items: center; gap: 10px; font: 400 13px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; }
.m-next__date { color: var(--gold); }
.next__cd { display: none; }
.meta-r { display: none; }

/* ---------- cards ---------- */
.card { display: none; }
.card {
  position: absolute; z-index: 5; width: 300px;
  border-radius: 26px 6px 26px 6px;
  border: 1px solid transparent;
  background:
    linear-gradient(var(--glass), var(--glass)) padding-box,
    linear-gradient(135deg, rgba(212,176,122,.65), rgba(139,111,209,.18) 38%, rgba(242,238,248,.06) 62%, rgba(212,176,122,.4)) border-box;
  -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: 0 24px 60px -30px rgba(0,0,0,.9);
  transition: box-shadow .4s var(--ease);
  will-change: transform;
}
.card:hover { box-shadow: 0 24px 60px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(212,176,122,.25), 0 0 40px -10px rgba(139,111,209,.45); }
.card__head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 6px; }
.card__count { margin-left: auto; font: 400 11px/1 var(--f-body); letter-spacing: .12em; color: var(--mist); font-variant-numeric: tabular-nums; }
.card__x { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(212,176,122,.5); color: var(--gold); display: grid; place-items: center; font: 300 15px/1 var(--f-body); transition: background .25s, color .25s; }
.card__x:hover { background: var(--gold); color: var(--night); }
.card__body { padding: 0 18px 14px; }
.card__foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 18px 14px; border-top: 1px solid rgba(212,176,122,.14); }

/* shared content pieces */
.m-flag { display: inline-block; padding: 3px 7px 2px; border-radius: 99px; border: 1px solid rgba(233,163,184,.45); font: 400 8.5px/1 var(--f-wide); letter-spacing: .16em; text-transform: uppercase; color: var(--rose); vertical-align: middle; }
.m-empty { margin: 10px 0; font: italic 400 15px/1.4 var(--f-display); color: var(--mist); }
.m-ext, .m-handle { font: 400 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); text-decoration: none; }
.m-ext:hover, .m-handle:hover { color: var(--star); }
.m-sets, .m-gigs, .m-posts, .m-videos { list-style: none; margin: 0; padding: 0; }
.m-set + .m-set, .m-gig + .m-gig, .m-post + .m-post { border-top: 1px solid rgba(242,238,248,.08); }

.m-set__btn { width: 100%; display: grid; grid-template-columns: 1fr 22px; column-gap: 10px; row-gap: 2px; padding: 7px 0; text-align: left; align-items: center; }
.m-set__code { font: 400 9px/1 var(--f-wide); letter-spacing: .2em; color: var(--gold); grid-column: 1; }
.m-set__title { grid-column: 1; font: italic 400 18px/1.15 var(--f-display); font-variation-settings: "opsz" 24; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-set__meta { grid-column: 1; font: 400 11px/1.3 var(--f-body); letter-spacing: .04em; color: var(--mist); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-set__state { grid-column: 2; grid-row: 1 / 4; justify-self: end; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(212,176,122,.55); position: relative; }
.m-set__state::after { content: ""; position: absolute; left: 8px; top: 6px; border-left: 7px solid var(--gold); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
button.m-set__btn:hover .m-set__state { background: var(--gold); }
button.m-set__btn:hover .m-set__state::after { border-left-color: var(--night); }
.m-set.is-open-slot .m-set__title { color: rgba(242,238,248,.38); }
.m-set.is-open-slot .m-set__state { border-style: dashed; border-color: rgba(242,238,248,.2); }
.m-set.is-open-slot .m-set__state::after { display: none; }
.m-set.is-playing .m-set__title { color: var(--rose); }
.m-set.is-playing .m-set__state { border-color: var(--rose); animation: halo var(--beat, .45s) ease-out infinite; }
.m-set.is-playing .m-set__state::after { left: 7px; top: 7px; border: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--rose); }
@keyframes halo { from { box-shadow: 0 0 0 0 rgba(233,163,184,.5); } to { box-shadow: 0 0 0 8px rgba(233,163,184,0); } }

.m-gig { display: grid; grid-template-columns: 50px 1fr auto; column-gap: 12px; row-gap: 3px; padding: 9px 0; align-items: center; }
.m-gig__date { grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-right: 12px; border-right: 1px solid rgba(212,176,122,.25); }
.m-gig__d { font: 400 26px/0.9 var(--f-display); font-variation-settings: "opsz" 72; font-variant-numeric: lining-nums tabular-nums; }
.m-gig__m { font: 400 9px/1 var(--f-wide); letter-spacing: .18em; color: var(--gold); }
.m-gig__y { display: none; }
.m-gig__where { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.m-gig__city { font: italic 400 17px/1.1 var(--f-display); text-wrap: balance; }
.m-gig__venue { font: 400 11px/1.2 var(--f-body); color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-gig__meta { grid-column: 3; grid-row: 1; font: 400 10.5px/1 var(--f-body); letter-spacing: .1em; color: var(--mist); text-align: right; }
.m-gig .m-flag, .m-gig__link { grid-column: 3; grid-row: 2; justify-self: end; }
.m-gig__link { font: 400 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }

.m-post__btn { width: 100%; display: grid; grid-template-columns: 1fr; row-gap: 4px; text-align: left; padding: 10px 0; }
.m-post__no { font: 400 9px/1 var(--f-wide); letter-spacing: .2em; color: var(--gold); }
.m-post__no::before { content: "No. "; }
.m-post__title { font: italic 400 19px/1.15 var(--f-display); font-variation-settings: "opsz" 28; text-wrap: balance; }
.m-post__meta { display: flex; gap: 8px; align-items: center; font: 400 11px/1 var(--f-body); letter-spacing: .08em; color: var(--mist); }
.m-post__btn:hover .m-post__title { color: var(--gold); }

.m-video__btn { width: 100%; display: grid; grid-template-columns: 128px 1fr; column-gap: 14px; row-gap: 4px; text-align: left; align-items: center; }
.m-video__thumb { grid-row: 1 / 3; position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px 3px 14px 3px; background: radial-gradient(circle at 30% 30%, rgba(139,111,209,.35), transparent 60%), #120e20; }
.m-video__thumb img { width: 100%; height: 100%; object-fit: cover; }
.m-video__play { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; border: 1px solid rgba(242,238,248,.8); background: rgba(8,7,13,.4); }
.m-video__play::after { content: ""; position: absolute; left: 11px; top: 8.5px; border-left: 9px solid var(--star); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.m-video__slot { position: absolute; inset: 0; display: grid; place-items: center; font: 400 8.5px/1 var(--f-wide); letter-spacing: .16em; text-transform: uppercase; color: var(--mist); }
.m-video__title { font: italic 400 18px/1.15 var(--f-display); }
.m-video__note { font: 400 10.5px/1.3 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.m-video__btn:hover .m-video__title { color: var(--gold); }
.m-video.is-open-slot .m-video__title { font: 400 11px/1.3 var(--f-body); color: var(--mist); }

.m-ig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.m-ig__item { display: block; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 12px 3px 12px 3px; background: #120e20; }
.m-ig__item img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transition: transform .9s var(--ease), filter .5s; filter: saturate(.9); }
.m-ig__item:hover img { transform: scale(1.06); filter: saturate(1.1); }

.m-cd { display: inline-flex; align-items: baseline; gap: 2px; margin-left: 8px; }
.m-cd b { font: 400 13px/1 var(--f-body); color: var(--star); font-variant-numeric: tabular-nums; }
.m-cd i { font: 400 8.5px/1 var(--f-wide); font-style: normal; letter-spacing: .1em; color: var(--gold); }

/* ---------- UNKNOWN · the radio show ---------- */
/* the logotype: Bebas Neue, star-white like the station ident, with a faint gold halo */
.m-unknown { font-family: "Bebas Neue", "Antonio", "Jost", sans-serif; font-weight: 400; font-style: normal; letter-spacing: .012em; text-transform: uppercase; color: var(--star); font-variation-settings: normal; }
.m-onair { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px 3px 7px; border-radius: 99px; border: 1px solid rgba(242,238,248,.22); white-space: nowrap; }
.m-onair__dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(242,238,248,.55); flex: none; }
.m-onair__text { font: 400 9px/1 var(--f-wide); letter-spacing: .18em; text-transform: uppercase; color: var(--mist); }
.m-onair[data-live="true"] { border-color: rgba(233,163,184,.75); background: rgba(233,163,184,.14); box-shadow: 0 0 18px -4px rgba(233,163,184,.6); }
.m-onair[data-live="true"] .m-onair__dot { border: 0; background: #ff8fae; box-shadow: 0 0 6px 1px rgba(255,143,174,.9); animation: lamp 1.6s ease-in-out infinite; }
.m-onair[data-live="true"] .m-onair__text { color: var(--star); }
@keyframes lamp { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

/* the radio card (desktop board) */
.c-radio { width: 334px; }
.c-radio .card__head { padding-bottom: 0; }
.c-radio .card__count { font: inherit; letter-spacing: normal; }
.radio__mark { display: flex; align-items: flex-end; gap: 12px; width: 100%; text-align: left; }
.radio__logo { display: block; flex: none; font-size: 58px; line-height: .86; padding-top: 2px; text-shadow: 0 0 28px rgba(212,176,122,.28); transition: color .3s, text-shadow .3s; }
.radio__mark:hover .radio__logo { color: #fff7ea; text-shadow: 0 0 30px rgba(212,176,122,.55); }
.radio__by { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding-bottom: 4px; }
.radio__by .label { font-size: 9px; letter-spacing: .22em; }
.radio__host { font: italic 400 15px/1 var(--f-display); color: var(--star); }
.radio__tag { margin: 8px 0 0; font: italic 400 13.5px/1.3 var(--f-display); font-variation-settings: "opsz" 14; color: var(--mist); text-wrap: balance; }
.radio__times { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; row-gap: 6px; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid rgba(212,176,122,.16); }
.radio__times dt { white-space: nowrap; font: 400 9px/1.2 var(--f-wide); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.radio__times dd { margin: 0; justify-self: end; text-align: right; font: 400 11.5px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--star); white-space: nowrap; }
.radio__times dd .m-flag { margin-left: 4px; }
.radio__times .m-cd { margin-left: 6px; }
.radio__times .m-cd:first-child { margin-left: 0; }

/* latest episode (module) */
.m-radio-latest { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(212,176,122,.16); }
.m-radio-latest__label { grid-column: 1 / -1; margin-bottom: 5px; font: 400 9px/1 var(--f-wide); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.m-radio-latest__open { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 4px; align-items: baseline; min-width: 0; text-align: left; }
.m-radio-latest__code { white-space: nowrap; font: 400 18px/1 "Bebas Neue", var(--f-body); letter-spacing: .03em; color: var(--gold); }
.m-radio-latest__title { min-width: 0; font: italic 400 17px/1.15 var(--f-display); font-variation-settings: "opsz" 24; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-radio-latest__meta { grid-column: 1 / -1; min-width: 0; font: 400 10.5px/1.3 var(--f-body); letter-spacing: .02em; color: var(--mist); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-radio-latest__open:hover .m-radio-latest__title { color: var(--gold); }
.m-radio-latest__play { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(212,176,122,.6); color: var(--gold); transition: background .25s, color .25s; }
.m-radio-latest__play > span:last-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.m-radio-latest__icon { position: absolute; left: 14px; top: 12px; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.m-radio-latest__play:hover { background: var(--gold); color: var(--night); }
.m-radio-latest.is-playing .m-radio-latest__title { color: var(--rose); }
.m-radio-latest.is-playing .m-radio-latest__play { border-color: var(--rose); color: var(--rose); animation: halo var(--beat, .45s) ease-out infinite; }
.m-radio-latest.is-playing .m-radio-latest__icon { left: 14px; top: 14px; width: 7px; height: 7px; border: 0; border-radius: 50%; background: currentColor; }

/* episode list (sheet, and any module that lists episodes) */
.m-episodes { list-style: none; margin: 0; padding: 0; }
.m-episode { display: grid; grid-template-columns: 1fr auto; column-gap: 14px; align-items: center; }
.m-episode + .m-episode { border-top: 1px solid rgba(242,238,248,.08); }
.m-episode__btn { display: grid; grid-template-columns: 74px 1fr; column-gap: 14px; row-gap: 4px; align-items: baseline; min-width: 0; padding: 12px 0; text-align: left; }
.m-episode__code { grid-row: 1 / 3; align-self: center; white-space: nowrap; font: 400 26px/1 "Bebas Neue", var(--f-body); letter-spacing: .03em; color: var(--gold); }
.m-episode__title { min-width: 0; font: italic 400 20px/1.15 var(--f-display); font-variation-settings: "opsz" 28; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-episode__meta { min-width: 0; font: 400 11px/1.3 var(--f-body); letter-spacing: .06em; color: var(--mist); }
.m-episode__btn:hover .m-episode__title { color: var(--gold); }
.m-episode__play { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(212,176,122,.6); color: var(--gold); transition: background .25s, color .25s; }
.m-episode__play span { position: absolute; left: 13px; top: 11px; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.m-episode__play:hover { background: var(--gold); color: var(--night); }
.m-episode__soon { padding: 5px 9px 4px; border-radius: 99px; border: 1px dashed rgba(242,238,248,.3); font: 400 9px/1 var(--f-wide); letter-spacing: .18em; text-transform: uppercase; color: rgba(242,238,248,.8); }
.m-episode.is-unreleased .m-episode__title { color: rgba(242,238,248,.62); }
.m-episode.is-unreleased .m-episode__code { color: rgba(212,176,122,.6); }
.m-episode.is-playing .m-episode__title, .m-episode.is-playing .m-episode__code { color: var(--rose); }
.m-episode.is-playing .m-episode__play { border-color: var(--rose); color: var(--rose); animation: halo var(--beat, .45s) ease-out infinite; }

/* radio sheet */
.m-radio { padding-top: 4px; }
.m-radio__head { display: grid; grid-template-columns: auto 1fr; column-gap: 26px; row-gap: 8px; align-items: end; }

/* the halo lives inside the logo's own box (a large text-shadow got clipped by the scrolling sheet body) */
.m-radio__logo::before { content: ""; position: absolute; inset: -4% -6%; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, rgba(212,176,122,.24), rgba(212,176,122,.08) 60%, transparent); }
.m-radio__desc { margin: 0; font: 400 9.5px/1.4 var(--f-wide); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.m-radio__tagline { margin: 0 0 4px; font: italic 400 21px/1.25 var(--f-display); font-variation-settings: "opsz" 28; color: var(--star); text-wrap: balance; }
.m-radio__status { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 14px 28px; margin: 26px 0 8px; padding: 16px 22px; border-radius: 26px 6px 26px 6px; border: 1px solid rgba(212,176,122,.22); background: rgba(139,111,209,.06); }
.m-radio__row { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; font: 400 13px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--star); }

.m-radio__label { font: 400 9.5px/1 var(--f-wide); letter-spacing: .2em; color: var(--gold); }

.m-radio__cd .m-cd { margin-left: 6px; } .m-radio__cd .m-cd:first-child { margin-left: 0; }
.m-radio__cd .m-cd b { font-size: 15px; }
.m-radio__sub, .m-ep__sub { margin: 28px 0 4px; font: 400 9.5px/1 var(--f-wide); letter-spacing: .26em; text-transform: uppercase; color: var(--gold); }
.sheet .m-episode__title { font-size: 24px; }
.sheet .m-episode__btn { padding: 15px 0; grid-template-columns: 104px 1fr; }
.sheet .m-episode__code { font-size: 30px; }

/* episode view */
.m-ep { max-width: 62ch; margin: 0 auto; padding-top: 8px; }

.m-ep__guest { margin: 14px 0 0; font: 300 19px/1.4 var(--f-body); color: var(--gold); }
.m-ep__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 22px; }
.m-ep__play { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 99px; border: 1px solid rgba(212,176,122,.6); font: 400 11px/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); transition: background .25s, color .25s; }
.m-ep__play:hover { background: var(--gold); color: var(--night); }
.m-ep__icon { width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.m-ep.is-playing .m-ep__play { border-color: var(--rose); color: var(--rose); }
.m-ep.is-playing .m-ep__icon { width: 7px; height: 7px; border: 0; border-radius: 50%; background: currentColor; animation: lamp 1.6s ease-in-out infinite; }
.m-ep.is-playing .m-ep__play:hover, .m-episode.is-playing .m-episode__play:hover, .m-radio-latest.is-playing .m-radio-latest__play:hover { background: var(--rose); color: var(--night); }
.m-ep__soon { font: italic 400 16px/1.3 var(--f-display); color: var(--mist); }
.m-tracklist { list-style: none; margin: 6px 0 0; padding: 0; }
.m-tracklist li { display: grid; grid-template-columns: 38px 1fr; align-items: baseline; padding: 9px 0; border-bottom: 1px solid rgba(242,238,248,.07); }
.m-tracklist__no { font: 400 9.5px/1 var(--f-wide); letter-spacing: .16em; color: var(--gold); }
.m-tracklist__track { font: italic 400 18px/1.3 var(--f-display); font-variation-settings: "opsz" 18; color: rgba(242,238,248,.88); }

/* live: the card and the locket take a rose glow */
html.radio-live .c-radio { background:
    linear-gradient(var(--glass), var(--glass)) padding-box,
    linear-gradient(135deg, rgba(233,163,184,.85), rgba(139,111,209,.25) 40%, rgba(242,238,248,.06) 62%, rgba(233,163,184,.55)) border-box;
  box-shadow: 0 24px 60px -30px rgba(0,0,0,.9), 0 0 46px -12px rgba(233,163,184,.5); }
html.radio-live .radio__logo { text-shadow: 0 0 26px rgba(233,163,184,.55); }
html.radio-live .locket__frame { box-shadow: 0 0 90px 10px rgba(139,111,209,.28), 0 0 40px 2px rgba(233,163,184,.22), inset 0 0 0 1px rgba(212,176,122,.12); }

/* phones: an on-air line above the quote */
.onair { position: absolute; z-index: 4; left: 50%; bottom: calc(146px + var(--deck, 0px) + env(safe-area-inset-bottom, 0px)); transition: bottom .5s var(--ease); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); padding: 4px 14px 4px 5px; border-radius: 99px; border: 1px solid rgba(212,176,122,.3); background: rgba(20,16,34,.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); white-space: nowrap; }
.onair__logo { font-size: 20px; line-height: 1; padding-top: 2px; }
.onair__when { display: inline-flex; align-items: baseline; gap: 6px; font: 400 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.onair__when .m-cd { margin-left: 3px; } .onair__when .m-cd:first-child { margin-left: 0; }
.onair__when .m-cd b { font-size: 11px; }
.onair__live { display: none; }
html.radio-live .onair { border-color: rgba(233,163,184,.6); }
html.radio-live .onair__off { display: none; }
html.radio-live .onair__live { display: inline-flex; }

/* deck */
.m-deck { --sc-color: #d4b07a; display: none; }
.m-deck__go { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px 14px; border-radius: 99px; border: 1px solid rgba(212,176,122,.55); font: 400 11px/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); transition: background .25s, color .25s; }
.m-deck__go:hover { background: var(--gold); color: var(--night); }
.m-deck__icon { width: 0; height: 0; border-left: 7px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.m-deck__live { display: none; }
.m-deck[data-state="playing"] .m-deck__idle { display: none; }
.m-deck[data-state="playing"] .m-deck__live { display: block; }
.m-deck__now { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font: 400 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--rose); }
.m-deck__title { color: var(--star); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .06em; }
/* a real hit box (32px; 40px on touch layouts) without changing the row height */
.m-deck__stop { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; margin: -11px -10px -11px 0; color: var(--gold); letter-spacing: .14em; text-transform: uppercase; }
.m-deck__stop:hover { color: var(--star); }
.m-deck__frame { border-radius: 4px; overflow: hidden; }
.m-deck__frame iframe { display: block; width: 100%; height: 20px; border: 0; }
.c-sets { display: contents; }
.c-sets > :not(.card__deck) { display: none; }
.card__deck { display: contents; }
.c-sets .m-deck[data-state="playing"] { display: block; position: fixed; z-index: 19; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); padding: 12px 16px; border-radius: 20px 5px 20px 5px; background: #141022; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(212,176,122,.3); }

/* dock (phones) */
.dock { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(6, minmax(0, 1fr)); padding: 6px; border-radius: 99px; background: rgba(20,16,34,.72); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); border: 1px solid rgba(212,176,122,.28); }
.dock button { padding: 17px 0; border-radius: 99px; font: 400 9.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
.dock .dock__unk { position: relative; padding: 9px 0 7px; font: 400 18px/1 "Bebas Neue", "Antonio", var(--f-body); letter-spacing: .03em; color: var(--star); }
html.radio-live .dock .dock__unk::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 4px 0 0; vertical-align: 4px; border-radius: 50%; background: #ff8fae; box-shadow: 0 0 6px 1px rgba(255,143,174,.9); animation: lamp 1.6s ease-in-out infinite; }
.dock button:hover, .dock button:focus-visible { color: var(--night); background: var(--gold); }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(8,7,13,.66); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); opacity: 0; transition: opacity .4s var(--ease); }
.sheet.is-open { opacity: 1; }
.sheet__frame { width: min(880px, 100%); height: min(86vh, 780px); display: flex; flex-direction: column; border-radius: 44px 8px 44px 8px; border: 1px solid transparent;
  background: linear-gradient(rgba(16,13,28,.94), rgba(16,13,28,.94)) padding-box, linear-gradient(135deg, rgba(212,176,122,.7), rgba(139,111,209,.2) 40%, rgba(212,176,122,.35)) border-box;
  box-shadow: 0 40px 120px -40px rgba(139,111,209,.45);
  transform: translateY(16px) scale(.985); transition: transform .55s var(--ease); overflow: hidden; }
.sheet.is-open .sheet__frame { transform: none; }
.sheet__head { display: flex; align-items: baseline; gap: 18px; padding: 26px 34px 14px; }
.sheet__title { margin: 0; font: italic 400 46px/1 var(--f-display); font-variation-settings: "opsz" 96; }
.sheet__close { margin-left: auto; padding: 8px 14px 7px; border-radius: 99px; border: 1px solid rgba(212,176,122,.45); }
.sheet__close:hover { background: var(--gold); color: var(--night); }
.sheet__body { flex: 1; min-height: 0; overflow: auto; padding: 4px 34px 32px; scrollbar-width: thin; scrollbar-color: rgba(212,176,122,.35) transparent; }
.sheet .m-set__title, .sheet .m-post__title, .sheet .m-gig__city { font-size: 24px; }
.sheet .m-set__btn, .sheet .m-post__btn, .sheet .m-gig { padding: 15px 0; }
.sheet .m-gig { grid-template-columns: 70px 1fr auto; }
.sheet .m-gig__d { font-size: 36px; }
.sheet .m-gig__y { display: block; font: 400 10px/1 var(--f-body); color: var(--mist); letter-spacing: .1em; }
.sheet .m-videos { display: grid; gap: 16px; margin-top: 18px; }
.m-sheet__foot { margin: 22px 0 0; }
.m-sheet__handles { margin: 8px 0 18px; display: flex; gap: 18px; }
.sheet .m-ig { gap: 10px; }
.m-player__frame { position: relative; aspect-ratio: 16 / 9; background: #000; margin-top: 10px; border-radius: 26px 6px 26px 6px; overflow: hidden; }
.m-player__frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.m-player__link { position: absolute; inset: 0; display: grid; place-items: center; text-decoration: none; }
.m-player__link img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.m-player__link span { position: relative; padding: 10px 16px; background: rgba(0,0,0,.6); font: 500 11px/1 var(--f-mono, var(--f-body)); letter-spacing: .16em; text-transform: uppercase; }
.m-player__info { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; margin-top: 16px; }
.m-player__title { margin: 0; font: italic 400 28px/1.1 var(--f-display); }
.m-player__note { margin: 0; font: 400 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.m-player__info .m-ext { margin-left: auto; }
.m-reader { max-width: 60ch; margin: 0 auto; padding-top: 8px; }
.m-reader__meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 0; font: 400 9.5px/1 var(--f-wide); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.m-reader__title { margin: 18px 0 0; font: italic 400 clamp(36px, 6vw, 58px)/1 var(--f-display); font-variation-settings: "opsz" 96; text-wrap: balance; }
.m-reader__lede { margin: 16px 0 0; font: 300 19px/1.45 var(--f-body); color: var(--gold); }
.m-reader__body { margin-top: 22px; }
.m-reader__body p { margin: 16px 0 0; font: 400 19px/1.6 var(--f-display); font-variation-settings: "opsz" 14; color: rgba(242,238,248,.88); }
.m-reader__body p:first-child::first-letter { float: left; font: italic 400 64px/0.8 var(--f-display); margin: 6px 10px 0 0; color: var(--gold); }
.m-reader__nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 36px; padding-top: 16px; border-top: 1px solid rgba(212,176,122,.2); }
.m-reader__nav button { font: italic 400 15px/1.3 var(--f-display); color: var(--mist); text-align: left; max-width: 48%; }
.m-reader__nav button:last-child { text-align: right; }
.m-reader__nav button:hover { color: var(--gold); }
.m-juliet { padding-top: 6px; }
.m-juliet__code { font: 400 9.5px/1 var(--f-wide); letter-spacing: .26em; text-transform: uppercase; color: var(--gold); }
.m-juliet__lines { margin: 12px 0 22px; font: italic 400 32px/1.15 var(--f-display); }
.m-juliet__gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.m-juliet__img { margin: 0; }
.m-juliet__img img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 22px 4px 22px 4px; }
.m-juliet__img figcaption { margin-top: 8px; font: italic 400 14px/1 var(--f-display); color: var(--mist); }

@media (max-width: 999px), (max-height: 599px), (max-aspect-ratio: 6/5) {
  /* while a set plays the fixed deck takes the slot above the dock: the stack (quote, on-air pill, next night) lifts by its height */
  html.is-playing { --deck: 70px; }
  .m-deck__stop { min-height: 40px; margin: -15px -10px -15px 0; }
  .sheet { padding: 0; }
  .sheet__frame { width: 100%; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet__head { padding: 18px 18px 8px; }
  .sheet__title { font-size: 36px; }
  .sheet__body { padding: 4px 18px 24px; }
  .m-juliet__gallery, .sheet .m-ig { grid-template-columns: repeat(2, 1fr); }
  .m-video__btn { grid-template-columns: 116px 1fr; }
  .m-radio__head { grid-template-columns: 1fr; row-gap: 10px; }
  .m-radio__logo { grid-row: auto; font-size: clamp(76px, 24vw, 132px); }
  .m-radio__tagline { font-size: 19px; }
  .m-radio__status { grid-template-columns: 1fr; gap: 12px; margin-top: 20px; padding: 14px 16px; border-radius: 22px 5px 22px 5px; }
  .m-radio__row, .m-radio__row:nth-child(n+4) { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
  .m-radio__row:first-child { flex-direction: column; align-items: flex-start; gap: 10px; }
  .sheet .m-episode__btn { grid-template-columns: 70px 1fr; column-gap: 12px; padding: 13px 0; }
  .sheet .m-episode__code { font-size: 24px; }
  .sheet .m-episode__title { font-size: 21px; white-space: normal; text-wrap: balance; }
}

/* short landscape (phones on their side): portrait left, words right */
@media (max-height: 599px) and (min-aspect-ratio: 6/5) {
  .kicker { top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .mast { top: calc(env(safe-area-inset-top, 0px) + 32px); font-size: min(15vh, 12vw); }
  .locket { left: 27%; top: calc(16vh + 40px); height: calc(100% - 16vh - 128px); min-height: 0; }
  .quote { left: 50%; right: 24px; top: calc(16vh + 46px); bottom: auto; }
  .m-quote__text { font-size: 18px; }
  .m-quote__by { margin-top: 8px; }
  .onair { left: calc(75% - 12px); bottom: calc(126px + env(safe-area-inset-bottom, 0px)); }
  .next { left: 50%; right: 24px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
  /* the playing deck: one slim row in the words column, clear of the locket; pill and next night tuck in above it */
  html.is-playing .next { bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }
  html.is-playing .onair { bottom: calc(154px + env(safe-area-inset-bottom, 0px)); }
  .c-sets .m-deck[data-state="playing"] { left: 50%; right: 24px; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); padding: 9px 14px; }
  .c-sets .m-deck[data-state="playing"] .m-deck__live { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; align-items: center; column-gap: 12px; }
  .c-sets .m-deck__now { display: contents; }
  .c-sets .m-deck__label { display: none; }
  .c-sets .m-deck__title { grid-column: 1; grid-row: 1; }
  .c-sets .m-deck__frame { grid-column: 2; grid-row: 1; }
  .c-sets .m-deck__stop { grid-column: 3; grid-row: 1; }
}

/* ======================= DESKTOP BOARD ======================= */
@media (min-width: 1000px) and (min-height: 600px) and (min-aspect-ratio: 6/5) {
  .board { inset: auto; left: 50%; top: 50%; width: 1280px; height: 800px; transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .dock { display: none; }
  #lines { display: block; position: absolute; inset: 0; width: 1280px; height: 800px; z-index: 1; pointer-events: none; }

  .kicker { top: 26px; }
  .mast { top: 38px; font-size: 132px; transform: translate3d(calc(var(--mx, 0) * 3px), calc(var(--my, 0) * 2px), 0); }

  .locket { top: 178px; height: auto; min-height: 0; max-height: none; width: 286px; transform: translate3d(calc(-50% + var(--mx, 0) * -6px), calc(var(--my, 0) * -5px), 0); }

  .quote { left: 390px; right: 390px; bottom: auto; top: 568px; }
  .m-quote__text { font-size: 23px; }

  .next { left: 390px; right: 390px; bottom: auto; top: 690px; gap: 10px; }
  .next__cd { display: block; }
  .meta-r { display: flex; gap: 16px; position: absolute; z-index: 4; bottom: 24px; right: 40px; }

  .card, .c-sets { display: block; }
  .c-sets > :not(.card__deck) { display: flex; }
  .c-sets > .card__body { display: block; }
  .card__deck { display: block; padding: 2px 18px 18px; }
  .c-sets .m-deck, .c-sets .m-deck[data-state="playing"] { display: block; position: static; padding: 0; border: 0; border-radius: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .onair { display: none; }
  /* sheets grow with the board on big screens, so their labels never end up smaller than the board's */
  .sheet__frame { width: min(880px, calc((100vw - 32px) / var(--sheet-s, 1))); height: min(calc(86vh / var(--sheet-s, 1)), 780px); scale: var(--sheet-s, 1); }
  /* left: sets, UNKNOWN, visuals · right: dates, transmissions, instagram */
  .c-sets  { left: 46px;  top: 20px; }
  .c-radio { left: 68px;  top: 342px; }
  .c-video { left: 40px;  top: 616px; }
  .c-gigs  { left: 934px; top: 30px; }
  .c-posts { left: 912px; top: 344px; }
  .c-insta { left: 948px; top: 572px; }
}

@media (prefers-reduced-motion: reduce) {
  .mast, .m-set.is-playing .m-set__state { animation: none !important; }
  .m-onair__dot, .dock .dock__unk::before, .m-episode__play, .m-radio-latest__play, .m-ep__icon { animation: none !important; }
}
</style>

<body>
<div class="sky" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="board" id="board">
  <canvas id="lines" width="1280" height="800" aria-hidden="true"></canvas>

  <p class="kicker label">Techno sets · Est. after midnight</p>
  <h1 class="mast">Maroata</h1>

  <figure class="locket" id="locket" style="margin:0">
    <svg class="rings back" viewBox="0 0 600 220" aria-hidden="true"><ellipse class="r2" cx="300" cy="110" rx="296" ry="104"/><ellipse class="r1" cx="300" cy="110" rx="250" ry="80"/><circle r="3" fill="#f2eef8"><animateMotion dur="38s" repeatCount="indefinite" path="M550,110 a250,80 0 1,0 -500,0 a250,80 0 1,0 500,0"/></circle></svg>
    <div class="locket__frame"><div class="locket__img"><img src="../assets/img/juliet/juliet-cosmic.jpg" alt="Juliet, the MAROATA muse, in cat-eye sunglasses with a star field in the lenses"></div></div>
    <svg class="rings front" viewBox="0 0 600 220" aria-hidden="true"><ellipse class="r1" cx="300" cy="110" rx="250" ry="80"/></svg>
    <button type="button" class="locket__open" data-open="juliet" aria-label="Open Juliet's file"></button>
    <span class="locket__tag label">Juliet · <span data-m="juliet-code"></span></span>
  </figure>

  <blockquote class="quote" data-m="quote" data-interval="9000"></blockquote>

  <div class="next">
    <span class="label">Next night</span>
    <span data-m="next-gig"></span>
    <span class="next__cd" data-m="countdown"></span>
  </div>

  <div class="meta-r label"><span data-m="bpm"></span><span data-m="clock" data-seconds="false"></span></div>

  <section class="card c-sets" aria-labelledby="t-sets" data-depth="10">
    <div class="card__head"><span class="label" id="t-sets">Sets</span><span class="card__count" data-m="count-sets"></span><button type="button" class="card__x" data-open="sets" aria-label="Open all sets">+</button></div>
    <div class="card__body" data-m="sets" data-limit="3"></div>

  <section class="card c-radio" aria-labelledby="t-radio" data-depth="12" data-signal>
    <div class="card__head"><span class="label" id="t-radio">Radio show</span><span class="card__count" data-m="radio-status"></span><button type="button" class="card__x" data-open="radio" aria-label="Open the UNKNOWN radio show">+</button></div>
    <div class="card__body">
      <button type="button" class="radio__mark" data-open="radio" aria-label="UNKNOWN radio show: schedule and episodes">
        <span class="radio__logo m-unknown" data-m="radio-name">UNKNOWN</span>

      </button>
      <dl class="radio__times">
        <dt>Airs</dt><dd data-m="radio-schedule"></dd>
        <dt data-m="radio-countdown-label" data-live-text="Ends in" data-off-text="Next in"></dt><dd data-m="radio-countdown"></dd>

  <section class="card c-posts" aria-labelledby="t-posts" data-depth="16">
    <div class="card__head"><span class="label" id="t-posts">Transmissions</span><span class="card__count" data-m="count-posts"></span><button type="button" class="card__x" data-open="posts" aria-label="Open all transmissions">+</button></div>
    <div class="card__body" data-m="posts" data-limit="2"></div>

  <section class="card c-gigs" aria-labelledby="t-gigs" data-depth="13">
    <div class="card__head"><span class="label" id="t-gigs">Dates</span><span class="card__count" data-m="count-gigs"></span><button type="button" class="card__x" data-open="gigs" aria-label="Open all dates">+</button></div>

  <section class="card c-video" aria-labelledby="t-video" data-depth="8">
    <div class="card__head"><span class="label" id="t-video">Visuals</span><span class="card__count">YouTube</span><button type="button" class="card__x" data-open="videos" aria-label="Open visuals">+</button></div>
    <div class="card__body" data-m="videos" data-limit="1"></div>

  <section class="card c-insta" aria-labelledby="t-insta" data-depth="18">
    <div class="card__head"><span class="label" id="t-insta">Instagram</span><span class="card__count" data-m="handles"></span><button type="button" class="card__x" data-open="insta" aria-label="Open Instagram">+</button></div>

  <button type="button" class="onair" data-open="radio" aria-label="UNKNOWN radio show">
    <span data-m="radio-status"></span>

    <span class="onair__when onair__off"><span data-m="radio-next"></span></span>

<div class="sheet" data-m="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet__frame">
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title" data-m="sheet-title"></h2>
      <span class="label">Maroata</span>
      <button type="button" class="sheet__close label" data-m="sheet-close">Close</button>
    </div>
    <div class="sheet__body" data-m="sheet-body"></div>
  </div>
</div>

<script src="../assets/content.js"></script>
<script src="../assets/maroata.js"></script>
<script>
(function () {
  const board = document.getElementById("board");
  M.fitBoard(board, 1280, 800, 1.6);
  M.parallax();
  const root = document.documentElement;
  // desktop sheets follow the board scale, but never shrink below 1:1
  const sheetScale = () => root.style.setProperty("--sheet-s", Math.max(1, Math.min(innerWidth / 1280, innerHeight / 800, 1.6)).toFixed(4));
  sheetScale(); addEventListener("resize", sheetScale);
  // the orbiting star on the locket ring is SMIL, which the reduced-motion CSS cannot reach
  if (M.reduced) document.querySelectorAll("svg.rings").forEach((s) => { if (s.pauseAnimations) { s.pauseAnimations(); s.setCurrentTime(0); } });
  const css = (name) => parseFloat(getComputedStyle(root).getPropertyValue(name)) || 0;

  /* ---------- star field ---------- */
  const sky = document.getElementById("stars");
  const ctx = sky.getContext("2d");
  let W = 0, H = 0, stars = [], meteor = null, nextMeteor = performance.now() + 5000;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    sky.width = W * dpr; sky.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W * H) / 2600);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() < .92 ? Math.random() * .9 + .2 : Math.random() * 1.3 + .9,
      a: Math.random() * .6 + .25, tw: Math.random() * 2 + .5, ph: Math.random() * 6.28,
      z: Math.random() * .9 + .1,
      gold: Math.random() < .12,
    }));
  }
  function drawSky(t) {
    ctx.clearRect(0, 0, W, H);
    const mx = css("--mx"), my = css("--my");
    for (const s of stars) {
      const drift = M.reduced ? 0 : t * 0.0012 * s.z;
      let x = (s.x - drift - mx * 14 * s.z) % W; if (x < 0) x += W;
      const y = s.y - my * 10 * s.z;
      const a = M.reduced ? s.a : s.a * (0.65 + 0.35 * Math.sin(t * 0.001 * s.tw + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = s.gold ? "#e8cf9f" : "#f2eef8";
      ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
      if (s.r > 1.4) { ctx.globalAlpha = a * .25; ctx.beginPath(); ctx.arc(x, y, s.r * 3.2, 0, 6.283); ctx.fill(); }
    }
    if (!M.reduced) {
      if (!meteor && t > nextMeteor) meteor = { x: W * (0.45 + Math.random() * 0.5), y: H * Math.random() * 0.35, t0: t };
      if (meteor) {
        const k = (t - meteor.t0) / 900;
        if (k > 1) { meteor = null; nextMeteor = t + 7000 + Math.random() * 9000; }
        else {
          const x = meteor.x - k * 260, y = meteor.y + k * 120;
          const g = ctx.createLinearGradient(x, y, x + 120, y - 55);
          g.addColorStop(0, "rgba(255,247,234,.9)"); g.addColorStop(1, "rgba(255,247,234,0)");
          ctx.globalAlpha = Math.sin(k * Math.PI);
          ctx.strokeStyle = g; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 120, y - 55); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- drifting cards + constellation lines (desktop board) ---------- */
  const lines = document.getElementById("lines");
  const lctx = lines.getContext("2d");
  const locket = document.getElementById("locket");
  const cards = Array.from(document.querySelectorAll(".card")).map((el, i) => ({
    el, depth: Number(el.dataset.depth) || 10, signal: "signal" in el.dataset,
    ax: 3 + (i * 2) % 4, ay: 4 + (i * 3) % 4,
    fx: 0.00045 + i * 0.00007, fy: 0.00055 + i * 0.00005, p: i * 1.7,
    hover: 0, dx: 0, dy: 0,
  }));
  cards.forEach((c) => {
    c.el.addEventListener("pointerenter", () => (c.target = 1));
    c.el.addEventListener("pointerleave", () => (c.target = 0));
    c.target = 0;
  });

  function star(x, y, r, a) {
    lctx.globalAlpha = a;
    lctx.fillStyle = "#f2eef8";
    lctx.beginPath(); lctx.arc(x, y, r, 0, 6.283); lctx.fill();
    lctx.globalAlpha = a * .3;
    lctx.beginPath(); lctx.arc(x, y, r * 3, 0, 6.283); lctx.fill();
  }

  // UNKNOWN: broadcast arcs leaving the radio card's star, rose and quicker while on air
  function signal(x, y, t, toRight) {
    const live = root.classList.contains("radio-live");
    const period = live ? 1600 : 3200;
    const dir = toRight ? 0 : Math.PI;
    lctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      const p = M.reduced ? (k + 1) / 3.2 : ((t / period + k / 3) % 1);
      const r = 5 + p * 22;
      lctx.globalAlpha = (1 - p) * (live ? 0.85 : 0.5);
      lctx.strokeStyle = live ? "#ff9fba" : "#d4b07a";
      lctx.beginPath(); lctx.arc(x, y, r, dir - 0.62, dir + 0.62); lctx.stroke();
    }
  }

  function drawLines(t) {
    lctx.clearRect(0, 0, 1280, 800);
    const mx = css("--mx"), my = css("--my");
    // locket centre and radii in board coordinates
    const lw = locket.offsetWidth, lh = locket.offsetHeight;
    const cx = 640 - mx * 6, cy = locket.offsetTop + lh / 2 - my * 5;
    const rx = lw / 2 + 8, ry = lh / 2 + 8;
    for (const c of cards) {
      c.dx = M.reduced ? 0 : Math.sin(t * c.fx + c.p) * c.ax + mx * c.depth;
      c.dy = M.reduced ? 0 : Math.sin(t * c.fy + c.p * 1.3) * c.ay + my * c.depth;
      c.el.style.transform = `translate3d(${c.dx.toFixed(2)}px, ${c.dy.toFixed(2)}px, 0)`;
      c.hover += (c.target - c.hover) * 0.08;
      const left = c.el.offsetLeft + c.dx, top = c.el.offsetTop + c.dy;
      const w = c.el.offsetWidth, h = c.el.offsetHeight;
      const onLeft = left + w / 2 < 640;
      const ax = onLeft ? left + w : left;
      const ay = top + Math.min(h * 0.5, 120);
      const ang = Math.atan2((ay - cy) / ry, (ax - cx) / rx);
      const bx = cx + Math.cos(ang) * rx, by = cy + Math.sin(ang) * ry;
      const mxp = ax + (bx - ax) * 0.42 + (onLeft ? 0 : 0), myp = ay + (by - ay) * 0.42 - 18;
      const g = lctx.createLinearGradient(ax, ay, bx, by);
      const a = 0.22 + c.hover * 0.5;
      g.addColorStop(0, `rgba(212,176,122,${a})`);
      g.addColorStop(1, `rgba(212,176,122,${a * 0.25})`);
      lctx.globalAlpha = 1;
      lctx.strokeStyle = g; lctx.lineWidth = 1;
      lctx.beginPath(); lctx.moveTo(ax, ay); lctx.lineTo(mxp, myp); lctx.lineTo(bx, by); lctx.stroke();
      star(ax, ay, 1.6, 0.7 + c.hover * 0.3);
      star(mxp, myp, 1.1 + c.hover * 0.6, 0.5 + c.hover * 0.5);
      if (c.signal) signal(ax, ay, t, onLeft);
    }
    lctx.globalAlpha = 1;
  }

  function frame(t) {
    if (!document.hidden) {
      drawSky(t);
      if (M.desktopQuery.matches) drawLines(t);
      else cards.forEach((c) => (c.el.style.transform = ""));
    }
    if (!M.reduced) requestAnimationFrame(frame);
  }
  size();
  addEventListener("resize", () => { size(); if (M.reduced) frame(0); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
